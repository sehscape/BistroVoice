# 50 scripted phone calls. The clock is frozen at Wednesday 18 November 2026,
# 15:00 London time, and every call starts from a fresh copy of data/*.csv.
#
# Turn fields
#   say:        what the caller says (spoken by a Piper caller voice in --mode voice)
#   heard:      what speech-to-text "heard" instead (simulated mishearing)
#   confidence: transcript confidence for `heard` (the agent's gate is 0.40)
#
# Expectation fields
#   booking:   none | {party_size, date, time, name?, phone?}   checked in the database
#   handoff:   true | false   was handoff_to_staff called
#   tools:     calls the LLM should make (args are a subset; order not checked)
#   allergen:  [{dish, allergen, truth: contains | absent | unconfirmed}]
#   reply_any / reply_all / reply_none: strings in the agent's replies (case-insensitive)
#   no_action_turns: turns (1-based) where the agent must not book or hand off

# ------------------------------------------------------------- simple bookings
- id: B01
  category: simple booking
  title: Two people tomorrow at 8pm
  turns:
    - say: Hi, can I book a table for two tomorrow at 8pm?
    - say: It's Alex Morgan, 07700 900201.
    - say: Yes, that's right.
  expect:
    booking: {party_size: 2, date: "2026-11-19", time: "20:00", phone: "07700900201"}
    handoff: false
    tools:
      - {name: check_table_availability, args: {date: "2026-11-19", time: "20:00", party_size: 2}}
      - {name: create_reservation, args: {name: Alex Morgan, phone: "07700900201", party_size: 2, date: "2026-11-19", time: "20:00"}}

